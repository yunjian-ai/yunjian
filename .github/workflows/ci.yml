name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 格式和禁用词检查
        run: python3 tools/validate.py
      - name: 配方是不是最新
        run: python3 tools/pack.py --check
      - name: 安装脚本实测
        run: python3 tools/test_install.py
      - name: 协同单子检查自测
        run: python3 tools/test_danzi.py
      - name: 青鸟夹具和反向用例
        run: python3 members/qingniao/tests/run_tests.py
      - name: 试金夹具和反向用例
        run: python3 members/shijin/tests/run_tests.py
      - name: 千机夹具和反向用例
        run: python3 members/qianji/tests/run_tests.py
      - name: 凝露夹具和反向用例
        run: python3 members/ninglu/tests/run_tests.py
      - name: 经纬夹具和反向用例
        run: python3 members/jingwei/tests/run_tests.py
      - name: 起元操盘夹具和反向用例
        run: python3 members/caopan/tests/run_tests.py
      - name: 照骨夹具和反向用例
        run: python3 members/zhaogu/tests/run_tests.py
